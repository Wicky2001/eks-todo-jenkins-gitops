# https://todo.jawsight.online, through main-gateway in istio-ingress (replaces the
# old nginx Ingress). HTTPS and the certificate are handled by the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo
  namespace: app
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-ingress
      sectionName: todo-https
  hostnames:
    - todo.jawsight.online
  rules:
    # /api and /health go to the backend
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: backend-stable-service
          port: 8081

    # everything else goes to the frontend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-service
          port: 8080
