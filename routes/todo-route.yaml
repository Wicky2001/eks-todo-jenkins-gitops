# https://todo.jawsight.online, through main-gateway in istio-ingress (replaces the
# old nginx Ingress). HTTPS and the certificate are handled by the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo
  namespace: app
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-ingress
      sectionName: todo-https
  hostnames:
    - todo.jawsight.online
  rules:
    # /api and /health go to the backend, through two doors.
    # Between releases: stable 100, canary 0 (everyone gets the stable version).
    # During a canary release Argo Rollouts changes these weights (90/10, 50/50, ...),
    # so the backend Argo CD app ignores them (argocd/apps/backend.yaml).
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: backend-stable-service
          port: 8081
          weight: 100
        - name: backend-canary-service
          port: 8081
          weight: 0

    # everything else goes to the frontend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-service
          port: 8080
