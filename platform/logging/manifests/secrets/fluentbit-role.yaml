# Elasticsearch role "fluentbit_writer": what fluentbit-user may do. ECK reads roles from a
# Secret (spec.auth.roles in elasticsearch.yaml). It holds no password, so it can be in Git.
apiVersion: v1
kind: Secret
metadata:
  name: fluentbit-role
  namespace: logging
stringData:
  roles.yml: |
    fluentbit_writer:
      indices:
        - names: ["logs-*"]
          privileges: ["create_index", "write"]
