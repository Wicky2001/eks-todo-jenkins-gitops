# Elasticsearch role "grafana_reader": what grafana-user may do. ECK reads roles from a
# Secret (spec.auth.roles in elasticsearch.yaml). It holds no password, so it can be in Git.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-role
  namespace: logging
stringData:
  roles.yml: |
    grafana_reader:
      cluster: ["monitor"]
      indices:
        - names: ["logs-*"]
          privileges: ["read", "view_index_metadata"]
