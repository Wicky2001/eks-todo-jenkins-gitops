# ExternalSecret: ESO copies the AWS Secrets Manager secret "eks-todo/grafana-user"
# into the Kubernetes Secret "grafana-user" here in namespace "logging".
# Elasticsearch user for Grafana (read logs-* only). ECK creates the user from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-user
  namespace: logging
spec:
  # check AWS again every hour (a password changed in AWS shows up here within 1 hour)
  refreshInterval: 1h
  # which vault: the ClusterSecretStore "aws-secrets-manager" (made by Terraform)
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    # the Kubernetes Secret ESO creates (and deletes again if this file is removed)
    name: grafana-user
    # ECK reads users from Secrets of this type (keys: username, password, roles)
    template:
      type: kubernetes.io/basic-auth
      # keep the fields fetched below (the default, Replace, would drop them)
      mergePolicy: Merge
  # copy every field of the AWS secret (it is JSON) as a key of the Kubernetes Secret
  dataFrom:
    - extract:
        key: eks-todo/grafana-user
