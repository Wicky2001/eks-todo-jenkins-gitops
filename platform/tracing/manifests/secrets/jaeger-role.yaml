# Elasticsearch role "jaeger_writer": what jaeger-user may do. ECK reads roles from a
# Secret (spec.auth.roles in elasticsearch.yaml). It holds no password, so it can be in Git.
apiVersion: v1
kind: Secret
metadata:
  name: jaeger-role
  namespace: tracing
stringData:
  roles.yml: |
    jaeger_writer:
      cluster: ["monitor", "manage_index_templates"]
      indices:
        - names: ["jaeger-*"]
          privileges: ["all"]
