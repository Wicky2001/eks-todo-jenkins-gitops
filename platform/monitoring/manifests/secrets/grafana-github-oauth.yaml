# ExternalSecret: ESO copies the AWS Secrets Manager secret "eks-todo/grafana-github-oauth"
# into the Kubernetes Secret "grafana-github-oauth" here in namespace "monitoring".
# Grafana's "Log in with GitHub" settings (see grafana-github-sso.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-github-oauth
  namespace: monitoring
spec:
  # check AWS again every hour (a password changed in AWS shows up here within 1 hour)
  refreshInterval: 1h
  # which vault: the ClusterSecretStore "aws-secrets-manager" (made by Terraform)
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    # the Kubernetes Secret ESO creates (and deletes again if this file is removed)
    name: grafana-github-oauth
  # copy every field of the AWS secret (it is JSON) as a key of the Kubernetes Secret
  dataFrom:
    - extract:
        key: eks-todo/grafana-github-oauth
