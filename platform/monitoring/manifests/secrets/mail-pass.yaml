# ExternalSecret: ESO copies the AWS Secrets Manager secret "eks-todo/mail-pass"
# into the Kubernetes Secret "mail-pass" here in namespace "monitoring".
# Gmail app password for the alert emails (key gmail-pass; see alerting/alertmanager-config.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-pass
  namespace: monitoring
spec:
  # check AWS again every hour (a password changed in AWS shows up here within 1 hour)
  refreshInterval: 1h
  # which vault: the ClusterSecretStore "aws-secrets-manager" (made by Terraform)
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    # the Kubernetes Secret ESO creates (and deletes again if this file is removed)
    name: mail-pass
  # copy every field of the AWS secret (it is JSON) as a key of the Kubernetes Secret
  dataFrom:
    - extract:
        key: eks-todo/mail-pass
