# ExternalSecret: ESO copies only the "password" field of the AWS Secrets Manager secret
# "eks-todo/grafana-user" into the Kubernetes Secret "grafana-es-credentials" here in
# namespace "monitoring". Grafana logs in to the logs Elasticsearch with it (ES_PASSWORD in
# helm-values.yaml). Same password as the grafana-user Secret in the logging namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-es-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-es-credentials
  data:
    # key "password" in the Kubernetes Secret  <-  field "password" of the AWS secret
    - secretKey: password
      remoteRef:
        key: eks-todo/grafana-user
        property: password
