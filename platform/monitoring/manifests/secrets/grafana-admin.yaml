# ExternalSecret: ESO copies the AWS Secrets Manager secret "eks-todo/grafana-admin"
# into the Kubernetes Secret "grafana-admin" here in namespace "monitoring".
# Grafana's admin login (keys admin-user, admin-password; see helm-values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  # check AWS again every hour (a password changed in AWS shows up here within 1 hour)
  refreshInterval: 1h
  # which vault: the ClusterSecretStore "aws-secrets-manager" (made by Terraform)
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    # the Kubernetes Secret ESO creates (and deletes again if this file is removed)
    name: grafana-admin
  # copy every field of the AWS secret (it is JSON) as a key of the Kubernetes Secret
  dataFrom:
    - extract:
        key: eks-todo/grafana-admin
