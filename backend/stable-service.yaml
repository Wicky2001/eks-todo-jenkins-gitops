# The "stable door": during a canary release it leads only to the OLD version's pods.
# The "canary door" is canary-service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: backend-stable-service
  namespace: app
spec:
  selector:
    app: backend
  type: ClusterIP
  ports:
    - protocol: TCP
      name: backend
      port: 8081
      targetPort: 8081
