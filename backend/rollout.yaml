# The backend as an Argo Rollout instead of a Deployment. Same pods (the template below
# is unchanged), but new versions are released as a canary by the Argo Rollouts
# controller, not all at once by the Kubernetes Deployment controller.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend-rollout
  namespace: app
  annotations:
    # Wave 0: updated only after the migration Job (wave -1) is Complete.
    argocd.argoproj.io/sync-wave: "0"
spec:
  # No replicas field: the HPA (hpa.yaml) decides the number of pods (2 to 5).

  # How a new version (a new image tag from Jenkins) is released.
  # The very first release has no old version yet, so it skips the steps.
  strategy:
    canary:
      # the two doors (stable-service.yaml and canary-service.yaml). Argo Rollouts adds a
      # version label to each one, so each door leads to one version only.
      stableService: backend-stable-service
      canaryService: backend-canary-service

      # Istio splits the traffic: the plugin changes the weights of the two doors in the
      # todo HTTPRoute (routes/todo-route.yaml).
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: todo
            namespace: app

      # The canary steps, run every time the image changes:
      steps:
        # 10% of /api requests go to the new version (1 new pod), then wait 5 minutes
        - setWeight: 10
        - pause: {duration: 5m}
        # half of the requests, then wait 5 minutes again
        - setWeight: 50
        - pause: {duration: 5m}
        # after the last step: 100%, the new version becomes the stable one,
        # and the old pods are removed

  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend-container
          image: 677501681528.dkr.ecr.us-east-1.amazonaws.com/eks-todo-backend:85fd91e8e28b67984a6d0f55e20026be1ddced84
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: backend-config-map
            - configMapRef:
                name: backend-db-config

          # requests: what the scheduler reserves on a node for this pod. The HPA
          # also measures CPU use as a % of the CPU request.
          # limits: memory only. Above 256Mi the container is restarted (OOMKilled).
          # No CPU limit, so the app is never slowed down while the node has spare CPU.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

          # Endpoints (backend/src/routes/healthRoutes.js in the app repo):
          #   /livez  only checks the process itself (no database)
          #   /readyz also checks the database with a "SELECT 1"

          # Startup: the server only starts listening after it has connected to the
          # database, so "answers /livez" also means "finished starting". Same endpoint as
          # liveness, as the Kubernetes docs recommend. Up to 60s (30 x 2s) to start.
          # Liveness and readiness only start after this passes.
          startupProbe:
            httpGet:
              path: /livez
              port: 8081
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          # Liveness: no answer for 30s (3 x 10s) = the process is stuck, so restart it.
          # It never checks the database: restarting pods would not fix a database outage.
          livenessProbe:
            httpGet:
              path: /livez
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Readiness: database unreachable (or no answer) = take the pod out of the Service
          # until it answers again. No restart. The app gives the database 10s, so the probe
          # waits 11s, to get the app's own "503 database down" answer. Checked every 10s,
          # so one check finishes before the next one starts.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 11
            failureThreshold: 2


